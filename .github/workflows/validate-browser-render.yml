name: Validate Browser AI Render Scheduler

on:
  push:
    branches:
      - browser-render-cursor-independent-2026-11-15
      - browser-render-advisor-global-hooks-2026-11-15
      - browser-render-pointer-independent-2026-11-15
      - browser-theme-concept-alignment-2026-11-15
      - browser-ai-theme-intelligence-2026-11-15
      - fix/browser-ai-gemini-cloud-only-2026-11-15
      - feature/browser-gpu-adaptive-gemini-failover-2026-11-16
      - feature/browser-gpu-renderer-gemini-resilience-2026-11-16
      - feature/browser-scene-composer-auto-fallback-2026-11-16
      - feature/browser-transparent-draggable-panels-center-sliders-2026-11-16
      - fix/browser-preview-height-runtime-diagnostics-2026-11-16
      - fix/browser-preview-drag-resizer-2026-11-16
      - fix/browser-gemini-vision-contact-sheet-2026-11-16
      - feature/browser-scene-composer-scene-intelligence-2026-11-16
      - fix/browser-pages-scene-intelligence-gemini-timeout-2026-11-16
      - feature/browser-hybrid-canvas-renderer-2026-11-16
      - feature/mp4-bitrate-ip-guardrails-2026-11-16
      - integration/browser-bitrate-ip-hybrid-canvas-2026-11-16
      - feature/canvas-render-speed-control-2026-11-17
      - fix/metadata-copy-clear-actions-2026-11-18
      - feature/original-content-ip-panel-2026-11-18
      - feature/preview-proxy-canvas-2026-11-18
      - feature/adaptive-render-memory-manager-2026-11-18
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright jszip
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/browser-ai-http.log 2>&1 &
          echo $! > /tmp/browser-ai-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/browser-ai-http.log
          exit 1
      - name: Check standalone JavaScript and scheduler wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check render-sync-advisor.js
          node --check js-motion-engine.js
          node --check logo-studio.js
          node --check metadata-actions.js
          node --check browser-ai-gemini-cloud.js
          node --check browser-ai-key-storage.js
          node --check browser-ai-webgpu-local.js
          node --check ip-guardrails-panel.js
          node --check browser-gpu-health.js
          node --check browser-gpu-frame-pipeline.js
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const inlineScripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]));
          if (!inlineScripts.length) throw new Error('No inline application scripts found');
          inlineScripts.forEach((match, index) => {
            const file = '/tmp/browser-ai-inline-' + index + '.js';
            fs.writeFileSync(file, match[2], 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write('Inline script ' + (index + 1) + ' syntax error\n');
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(1);
            }
          });
          console.log('Validated ' + inlineScripts.length + ' inline application scripts.');
          if (!html.includes("fetchBlob(coreBlobUrl,'text/javascript'") || !html.includes("fetchBlob(wasmBlobUrl,'application/wasm'")) {
            throw new Error('FFmpeg core/WASM download progress reader is not wired into initialization');
          }
          if (!html.includes('setTimeout(()=>trozalScheduleRenderTask(draw),Math.max(0,nextFrameAt-performance.now()))')) {
            throw new Error('Real-time render loop is not routed through the shared scheduler');
          }
          if (!html.includes('pointer-events:none;user-select:none')) {
            throw new Error('Top render progress monitor is not pointer-independent');
          }
          if (!html.includes('browser-gpu-health.js')) {
            throw new Error('GPU health monitor script is not loaded');
          }
          if (!html.includes('render-sync-advisor.js')) {
            throw new Error('Render Sync Advisor standalone script is not loaded');
          }
          console.log('Validated standalone Advisor syntax and render scheduler wiring.');
          NODE
          node tests/metadata-actions.test.cjs
          node tests/ip-guardrails-panel.test.cjs
          node tests/browser-render-scheduler.test.cjs
          node tests/canvas-render-speed.test.cjs
          node tests/smart-render-preflight.test.cjs
          node --check preview-proxy.js
          node tests/preview-proxy.test.cjs
          node --check render-memory-manager.js
          node tests/render-memory-manager.test.cjs
          node tests/render-frame-store.test.cjs
          node tests/browser-gpu-health.test.cjs
          node tests/hybrid-canvas-renderer.test.cjs
          node tests/mp4-bitrate-ip-guardrails.test.cjs
          node tests/browser-gemini-failover.test.cjs
          node tests/browser-gemini-failover.runtime.test.cjs
          node tests/browser-webgpu-local.test.cjs
          node tests/browser-gemini-vision-fallback.test.cjs
      - name: Guard central workspace and export capabilities
        run: node tests/workspace-export-preservation.test.cjs
      - name: Verify checked-out test revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          sha256sum tests/render-sync-advisor.browser.cjs render-sync-advisor.js
          grep -n "timeout: 12000\|snapshot=" tests/render-sync-advisor.browser.cjs
      - name: Verify GPU frame pipeline in Chromium with safe fallback
        run: node tests/browser-gpu-frame-pipeline.browser.cjs
      - name: Benchmark adaptive hybrid Canvas and verify PNG export
        run: node tests/hybrid-canvas-renderer.browser.cjs
      - name: Verify Canvas2D export fallback when WebGL2 is unavailable
        run: node tests/browser-gpu-canvas2d-fallback.browser.cjs
      - name: Exercise Render Sync Advisor in Chromium
        run: node tests/render-sync-advisor.browser.cjs
      - name: Compare render throughput with pointer over and away from progress panel
        run: node tests/render-pointer-independence.browser.cjs
      - name: Validate theme categories and AI prompt alignment in Chromium
        run: node tests/theme-concept-alignment.browser.cjs
      - name: Audit all catalogue themes and domain-specific AI prompts
        run: node tests/theme-catalogue-coverage.browser.cjs
      - name: Validate 333 theme-linked transparent icon collections
        run: node tests/theme-icon-catalogue.browser.cjs
      - name: Validate independent Logo Studio, search, theme isolation and SVG export
        run: node tests/logo-studio.browser.cjs
      - name: Test floating render monitor interactions in Chromium
        run: node tests/floating-render-monitor.browser.cjs
      - name: Validate scene intelligence beat planning and continuity guidance
        run: node tests/scene-intelligence.test.cjs
      - name: Verify Scene Intelligence source asset and API
        run: node tests/scene-intelligence-loading.test.cjs
      - name: Verify Scene Intelligence loads in Chromium workspace
        run: node tests/scene-intelligence-loading.browser.cjs
      - name: Test Gemini Cloud-only Scene Composer and Browser Vision
        run: node tests/browser-cloud-ai.browser.cjs
      - name: Test JavaScript Studio scenes and keyframe timeline
        run: node tests/js-motion-studio-timeline.test.cjs
      - name: Test AI Prompt-to-JavaScript concepts and editor integration
        run: node tests/js-motion-studio-ai-prompt.browser.cjs
      - name: Test JavaScript Studio full Professional theme catalogue and prompt builder
        run: node tests/js-motion-studio-theme-prompt.browser.cjs
      - name: Export JavaScript Studio animation to PNG Sequence ZIP
        run: node tests/js-motion-studio-pngseq-export.browser.cjs
      - name: Test JavaScript Studio PNG, MP4 and ProRes export test panel
        run: node tests/js-motion-studio-export-test-panel.browser.cjs
      - name: Verify Classic workspace layout on Android phone viewport
        run: node tests/classic-android-layout.browser.cjs
      - name: Test JavaScript Studio play, pause, resume and frame queue stability
        run: node tests/js-motion-studio-playback.browser.cjs
      - name: Test dynamic preview duration, speed, latest-code apply and IP prompt guardrails
        run: node tests/js-motion-studio-dynamic-preview.browser.cjs
      - name: Test direct Canvas transform gizmo in Chromium
        run: node tests/js-motion-studio-transform.browser.cjs
      - name: Verify Preview Proxy changes only preview canvas resolution
        run: node tests/preview-proxy.browser.cjs
      - name: Verify Preview height slider and Runtime Diagnostics controls
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#trozalCenterHeight');
            await page.locator('#trozalCenterHeight').evaluate(el => {
              el.value = '70';
              el.dispatchEvent(new Event('input', { bubbles: true }));
            });
            const preview = await page.locator('.main .stagewrap').evaluate(el => ({
              height: el.style.height,
              flex: el.style.flex
            }));
            assert.equal(preview.height, '70vh', 'Preview height slider must resize the actual stage wrapper');
            assert.match(preview.flex, /70vh/, 'Preview flex-basis must follow the selected height');
            await page.waitForSelector('#trozalDebugFab');
            await page.locator('#trozalDebugFab').click();
            await page.waitForFunction(() => document.getElementById('trozalDebugPanel')?.classList.contains('open'));
            await page.locator('#trozalDebugPanel .debug-minimize').click();
            await page.waitForFunction(() => document.getElementById('trozalDebugPanel')?.classList.contains('minimized'));
            await page.locator('#trozalDebugPanel .debug-minimize').click();
            await page.waitForFunction(() => !document.getElementById('trozalDebugPanel')?.classList.contains('minimized'));
            assert.deepEqual(errors, [], 'Unexpected browser page errors');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Verify draggable vertical Live Preview resize handle
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            const grip = page.locator('#trozalPreviewResizeGrip');
            await grip.waitFor();
            const preview = page.locator('.main .stagewrap');
            const before = await preview.evaluate(el => el.getBoundingClientRect().height);
            const box = await grip.boundingBox();
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2);
            await page.mouse.down();
            await page.mouse.move(box.x + box.width / 2, box.y - 95, { steps: 8 });
            await page.mouse.up();
            const after = await preview.evaluate(el => el.getBoundingClientRect().height);
            assert.ok(after > before + 60, 'Dragging the divider upward must enlarge Live Preview');
            await page.keyboard.press('Tab');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Stop local preview server
        if: always()
        run: if [ -f /tmp/browser-ai-http.pid ]; then kill "$(cat /tmp/browser-ai-http.pid)" || true; fi
