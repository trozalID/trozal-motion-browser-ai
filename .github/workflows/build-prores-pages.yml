name: Build ProRes WASM and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js-motion-engine.js'
      - 'browser-ai-gemini-cloud.js'
      - 'browser-ai-key-storage.js'
      - 'browser-ai-webgpu-local.js'
      - 'hybrid-canvas-renderer.js'
      - 'browser-gpu-health.js'
      - 'browser-gpu-frame-pipeline.js'
      - 'render-sync-advisor.js'
      - 'js/scene-intelligence.js'
      - 'metadata-quality-delivery.js'
      - 'metadata-actions.js'
      - 'ip-guardrails-panel.js'
      - 'smart-render-preflight.js'
      - 'preview-proxy.js'
      - 'render-memory-manager.js'
      - 'render-frame-store.js'
      - 'logo-studio.js'
      - 'tests/logo-studio.browser.cjs'
      - 'tests/logo-studio-contract.test.cjs'
      - 'tests/render-frame-store.test.cjs'
      - 'tests/render-memory-manager.test.cjs'
      - 'tests/ffmpeg-wasm-runtime-smoke.browser.cjs'
      - 'tests/js-motion-studio-real-video-export.browser.cjs'
      - 'tests/js-motion-studio-export-matrix.browser.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep each PR validation isolated from production deployment and other PRs.
  group: github-pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout TROZAL MOTION
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/js site/vendor/ffmpeg site/vendor/prores-core
          cp index.html site/index.html
          cp trozal-image-to-code-video.js site/trozal-image-to-code-video.js
          cp js-motion-engine.js site/js-motion-engine.js
          cp js/scene-intelligence.js site/js/scene-intelligence.js
          cp metadata-quality-delivery.js site/metadata-quality-delivery.js
          cp metadata-actions.js site/metadata-actions.js
          cp ip-guardrails-panel.js site/ip-guardrails-panel.js
          cp smart-render-preflight.js site/smart-render-preflight.js
          cp preview-proxy.js site/preview-proxy.js
          cp render-memory-manager.js site/render-memory-manager.js
          cp render-frame-store.js site/render-frame-store.js
          cp browser-ai.js site/browser-ai.js
          cp render-sync-advisor.js site/render-sync-advisor.js
          cp browser-ai-gemini-cloud.js site/browser-ai-gemini-cloud.js
          cp browser-ai-key-storage.js site/browser-ai-key-storage.js
          cp browser-ai-webgpu-local.js site/browser-ai-webgpu-local.js
          cp hybrid-canvas-renderer.js site/hybrid-canvas-renderer.js
          cp browser-gpu-health.js site/browser-gpu-health.js
          cp browser-gpu-frame-pipeline.js site/browser-gpu-frame-pipeline.js
          cp logo-studio.js site/logo-studio.js
          cp icon-logo-motion-studio.js site/icon-logo-motion-studio.js
          touch site/.nojekyll

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/trozal-image-to-code-video.js
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('site/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)];
          if (!scripts.length) throw new Error('No script blocks found in site/index.html');
          scripts.forEach((match, index) => {
            const file = path.join('/tmp', 'trozal-inline-' + index + '.js');
            fs.writeFileSync(file, match[1], 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write('JavaScript syntax error in script block ' + (index + 1) + '\n');
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(1);
            }
          });
          console.log('Validated JavaScript syntax in ' + scripts.length + ' script block(s).');
          NODE

      - name: Vendor FFmpeg worker package and JSZip locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/npm-ffmpeg /tmp/npm-jszip
          npm pack @ffmpeg/ffmpeg@0.12.15 --pack-destination /tmp/npm-ffmpeg
          tar -xzf /tmp/npm-ffmpeg/ffmpeg-ffmpeg-0.12.15.tgz -C /tmp/npm-ffmpeg
          cp -R /tmp/npm-ffmpeg/package/dist/esm/. site/vendor/ffmpeg/
          npm pack jszip@3.10.1 --pack-destination /tmp/npm-jszip
          tar -xzf /tmp/npm-jszip/jszip-3.10.1.tgz -C /tmp/npm-jszip
          cp /tmp/npm-jszip/package/dist/jszip.min.js site/vendor/jszip.min.js
          test -s site/vendor/ffmpeg/index.js
          test -s site/vendor/ffmpeg/worker.js
          test -s site/vendor/jszip.min.js
          test -s site/browser-gpu-health.js
          test -s site/browser-gpu-frame-pipeline.js

      - name: Build FFmpeg core with ProRes 4444 enabled
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v12.15 https://github.com/ffmpegwasm/ffmpeg.wasm.git /tmp/ffmpeg-wasm
          cd /tmp/ffmpeg-wasm
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("Dockerfile")
          text = p.read_text()

          # Upstream emsdk Dockerfile uses Ubuntu apt repositories over HTTP.
          # Force HTTPS so Docker build does not hang on archive.ubuntu.com:80.
          apt_pattern = r"(?m)^(?P<indent>[ ]*)RUN apt-get update && \\\n(?P=indent)      apt-get install -y pkg-config autoconf automake libtool ragel\s*$"
          apt_lines = [
              "RUN set -eu; \\",
              "    for mirror in https://azure.archive.ubuntu.com/ubuntu https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do \\",
              "      echo \"Trying Ubuntu mirror: $mirror\"; \\",
              "      find /etc/apt -type f \\( -name '*.list' -o -name '*.sources' \\) -exec sed -i \\",
              "        -e \"s|http://archive.ubuntu.com/ubuntu|$mirror|g\" \\",
              "        -e \"s|https://archive.ubuntu.com/ubuntu|$mirror|g\" {} +; \\",
              "      rm -rf /var/lib/apt/lists/*; \\",
              "      if apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update && apt-get install -y --no-install-recommends pkg-config autoconf automake libtool ragel; then exit 0; fi; \\",
              "    done; \\",
              "    echo \"All Ubuntu mirrors failed\"; exit 1",
          ]
          patched, apt_count = re.subn(
              apt_pattern,
              lambda m: "\n".join(m.group("indent") + line for line in apt_lines),
              text,
              count=1,
          )
          if apt_count != 1:
              raise SystemExit("Could not locate emsdk apt dependency block; no build performed.")

          # Keep retries on later apt-get layers as well (zimg-builder).
          patched = patched.replace(
              "RUN apt-get update && apt-get install -y git",
              "RUN apt-get -o Acquire::Retries=5 -o Acquire::https::Timeout=60 update && apt-get install -y --no-install-recommends git",
          )

          # Enable the ProRes encoder and MOV/PNG input-output support.
          pattern = r"(?m)^(?P<indent>[ ]*)RUN bash -x /src/build\.sh \\\n(?P=indent)      --enable-gpl \\\n"

          def patch(match):
              indent = match.group("indent")
              lines = [
                  "RUN bash -x /src/build.sh \\",
                  "      --enable-encoder=prores_ks \\",
                  "      --enable-decoder=png \\",
                  "      --enable-demuxer=image2 \\",
                  "      --enable-muxer=mov \\",
                  "      --enable-protocol=file \\",
                  "      --enable-gpl \\",
              ]
              return "\n".join(indent + line for line in lines) + "\n"

          patched, count = re.subn(pattern, patch, patched, count=1)
          if count != 1:
              raise SystemExit("Could not locate FFmpeg configure block with indentation; no build performed.")
          p.write_text(patched)

          PY
          make prd
          mkdir -p "$GITHUB_WORKSPACE/site/vendor/prores-core"
          cp packages/core/dist/esm/ffmpeg-core.js "$GITHUB_WORKSPACE/site/vendor/prores-core/"
          cp packages/core/dist/esm/ffmpeg-core.wasm "$GITHUB_WORKSPACE/site/vendor/prores-core/"
          test -s "$GITHUB_WORKSPACE/site/vendor/prores-core/ffmpeg-core.js"
          test -s "$GITHUB_WORKSPACE/site/vendor/prores-core/ffmpeg-core.wasm"

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--enable-encoder=prores_ks' /tmp/ffmpeg-wasm/Dockerfile
          test -s site/index.html
          test -s site/logo-studio.js
          test -s site/icon-logo-motion-studio.js
          node --check site/icon-logo-motion-studio.js
          test -s site/render-frame-store.js
          test -s site/js/scene-intelligence.js
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('site/index.html', 'utf8');
          const refs = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)].map(match => match[1]);
          const root = path.resolve('site');
          const missing = refs.filter(src => {
            if (/^(?:[a-z]+:)?\/\//i.test(src) || /^(?:data:|blob:)/i.test(src)) return false;
            const clean = decodeURIComponent(src.split(/[?#]/, 1)[0]);
            const target = path.resolve(root, clean.replace(/^\.\//, ''));
            return !target.startsWith(root + path.sep) || !fs.existsSync(target);
          });
          if (missing.length) throw new Error('Missing local script assets in Pages artifact: ' + missing.join(', '));
          console.log('Verified ' + refs.length + ' script src asset(s) in Pages artifact.');
          NODE
          test -s site/metadata-quality-delivery.js
          test -s site/render-sync-advisor.js
          test -s site/browser-ai-gemini-cloud.js
          test -s site/browser-ai-key-storage.js
          test -s site/browser-ai-webgpu-local.js
          test -s site/vendor/ffmpeg/worker.js
          test -s site/vendor/prores-core/ffmpeg-core.js
          test -s site/vendor/prores-core/ffmpeg-core.wasm
          ls -lh site/vendor/prores-core site/vendor/ffmpeg | head -40
          du -sh site

      - name: Install Playwright Chromium for real FFmpeg WASM smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke test generated GitHub Pages assets and real MP4/ProRes encoding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/trozal-motion-browser-ai
          cp -R site/vendor site/trozal-motion-browser-ai/vendor
          printf '<!doctype html><meta charset="utf-8"><title>TROZAL FFmpeg smoke</title>' > site/trozal-motion-browser-ai/__ffmpeg_smoke__.html
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/trozal-pages-smoke.log 2>&1 &
          echo $! > /tmp/trozal-pages-smoke.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/trozal-motion-browser-ai/__ffmpeg_smoke__.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/trozal-motion-browser-ai/vendor/ffmpeg/index.js >/dev/null
          curl -fsS http://127.0.0.1:4173/trozal-motion-browser-ai/vendor/ffmpeg/worker.js >/dev/null
          curl -fsS http://127.0.0.1:4173/trozal-motion-browser-ai/vendor/prores-core/ffmpeg-core.js >/dev/null
          curl -fsS http://127.0.0.1:4173/trozal-motion-browser-ai/vendor/prores-core/ffmpeg-core.wasm >/dev/null
          node tests/ffmpeg-wasm-runtime-smoke.browser.cjs
          node tests/js-motion-studio-real-video-export.browser.cjs
          node tests/js-motion-studio-export-matrix.browser.cjs
          kill "$(cat /tmp/trozal-pages-smoke.pid)" || true
          rm -rf site/trozal-motion-browser-ai

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site


  deploy-pages:
    needs: build-site
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
